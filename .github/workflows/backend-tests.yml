name: Backend tests

# Runs the concept-compiler test suite (Qiskit + Aer, no secrets, no deploy).
on:
  pull_request:
    paths: ["backend/**", "frontend/js/ir.js", "frontend/js/pseudocode.js", "frontend/js/qiskit-generator.js"]
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: ./backend
        run: python -m pytest tests -q
